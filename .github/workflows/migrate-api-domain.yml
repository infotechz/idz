name: Migrate IDZ API domain

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'chore: use official IDZ API domain'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Railway public URL with official API domain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('idz-app.js')
          text = path.read_text(encoding='utf-8')
          old = 'const RAILWAY_BACKEND_URL = "https://backend-informatica-do-zero-production.up.railway.app";'
          new = 'const RAILWAY_BACKEND_URL = "https://api.idzoficial.com";'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 backend base URL declaration, found {count}. No file changed.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify migration and remove temporary workflow
        shell: bash
        run: |
          grep -F 'const RAILWAY_BACKEND_URL = "https://api.idzoficial.com";' idz-app.js
          if grep -Fq 'https://backend-informatica-do-zero-production.up.railway.app' idz-app.js; then
            echo 'Old Railway URL still present' >&2
            exit 1
          fi
          rm -f .github/workflows/migrate-api-domain.yml

      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add idz-app.js .github/workflows/migrate-api-domain.yml
          git commit -m 'chore: use official IDZ API domain'
          git push
