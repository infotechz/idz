<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informática do Zero — Curso Completo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, doc, setDoc, getDoc, getDocs, collection, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      window.firebaseModules = { doc, setDoc, getDoc, getDocs, collection, updateDoc };
    </script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-cyan: #38bdf8;
            --green: #10b981;
            --accent-blue: #6366f1;
            --accent-hover: #4f46e5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 20px; text-align: center; }
        h1 { font-size: 24px; font-weight: 800; color: #fff; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; width: 100%; flex: 1; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { background: var(--accent-blue); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .module-title { font-size: 18px; font-weight: 700; color: var(--accent-cyan); margin-bottom: 10px; }
        .lesson-item { padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .lesson-item:last-child { border-bottom: none; }
        #loading { text-align: center; padding: 50px; font-size: 18px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <header>
        <h1>💻 INFORMÁTICA DO ZERO</h1>
        <p style="color: var(--text-secondary); font-size: 14px; margin-top: 5px;">Curso Completo para Iniciantes</p>
    </header>

    <div class="container" id="app-container">
        <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Carregando curso e estrutura...</div>
    </div>

    <!-- Script principal de integração e carregamento dinâmico -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Substitua abaixo com as suas credenciais reais do Firebase se ainda não estiverem configuradas globalmente
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "informatica-do-zero-40928",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        let app;
        try {
            app = initializeApp(firebaseConfig);
        } catch (e) {
            // Caso já inicializado em outro script
        }
        const db = getFirestore();
        window.db = db;

        window.generateOfficialCertificatePDF = function(studentName) {
            alert("Gerando o Certificado Oficial em PDF para: " + (studentName || "Aluno(a)") + ". Parabéns pela conquista!");
        }

        async function initApp() {
            const container = document.getElementById('app-container');
            try {
                const querySnapshot = await getDocs(collection(db, "modules"));
                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="card" style="text-align: center;">
                            <h2 class="module-title">⚠️ Nenhum Módulo Encontrado no Banco de Dados</h2>
                            <p style="color: var(--text-secondary); margin: 15px 0;">O banco do Firestore está vazio. Certifique-se de ter injetado a ementa completa pelo console do navegador.</p>
                            <button class="btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> Recarregar Página</button>
                        </div>
                    `;
                    return;
                }

                let modulesList = [];
                querySnapshot.forEach((docSnap) => {
                    modulesList.push({ id: docSnap.id, ...docSnap.data() });
                });
                // Ordena por ID numérico
                modulesList.sort((a, b) => Number(a.id) - Number(b.id));

                let htmlContent = `
                    <div class="card">
                        <h2 class="module-title"><i class="fa-solid fa-graduation-cap"></i> Bem-vindo ao Painel do Aluno</h2>
                        <p style="color: var(--text-secondary); line-height: 1.6; margin-top: 8px;">
                            Sua jornada rumo à autonomia digital está estruturada em 12 módulos principais e 3 bônus exclusivos. 
                            Estude as aulas, responda aos quizzes e resgate seu certificado ao final!
                        </p>
                    </div>
                `;

                modulesList.forEach(mod => {
                    htmlContent += `
                        <div class="card">
                            <h3 class="module-title">${mod.title}</h3>
                            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 15px;">${mod.intro || ''}</p>
                            <div style="background: rgba(15,23,42,0.4); border-radius: 8px; border: 1px solid var(--border-color);">
                    `;
                    
                    if (mod.lessons && Array.isArray(mod.lessons)) {
                        mod.lessons.forEach(lesson => {
                            htmlContent += `
                                <div class="lesson-item">
                                    <span style="font-weight: 500; font-size: 15px;"><i class="fa-regular fa-circle-play" style="color: var(--accent-cyan); margin-right: 8px;"></i> ${lesson.title}</span>
                                    <span style="font-size: 12px; color: var(--green); font-weight: 600;"><i class="fa-solid fa-check"></i> Disponível</span>
                                </div>
                            `;
                        });
                    }

                    htmlContent += `</div></div>`;
                });

                // Bloco de Conclusão e Certificado Oficial (Ativado ao final do curso)
                htmlContent += `
                    <div style="margin-top: 35px; padding: 32px; background: radial-gradient(circle at center, rgba(16, 185, 129, 0.15), rgba(15, 23, 42, 0.95)); border: 2px solid var(--green); border-radius: 24px; text-align: center; box-shadow: 0 0 30px rgba(16,185,129,0.25);">
                        <div style="font-size: 56px; margin-bottom: 12px; filter: drop-shadow(0 0 10px rgba(16,185,129,0.5));">🏆🎉</div>
                        <h3 style="color: #fff; font-size: 24px; font-weight: 800; margin-bottom: 8px;">PARABÉNS! VOCÊ CONCLUIU A SUA JORNADA!</h3>
                        <p style="color: var(--accent-cyan); font-size: 15px; font-weight: 700; margin-bottom: 16px;">Sua Autonomia Digital começa agora!</p>
                        
                        <p style="color: var(--text-secondary); font-size: 14px; max-width: 650px; margin: 0 auto 24px; line-height: 1.6;">
                            Você passou com sucesso por todos os fundamentos do computador, teclado e mouse, arquivos, internet, e-mail, documentos, planilhas, apresentações, nuvem, segurança digital e inteligência artificial.
                            <br><br>
                            <strong>Lembre-se: quanto mais você utiliza o computador, mais natural se torna o aprendizado.</strong> 🚀💻
                        </p>

                        <button class="btn" style="background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-size: 14px; padding: 16px 28px; box-shadow: 0 10px 25px rgba(16,185,129,0.4);" onclick="generateOfficialCertificatePDF('Aluno(a)')">
                            <i class="fa-solid fa-file-pdf" style="font-size: 18px;"></i> BAIXAR SEU CERTIFICADO OFICIAL (PDF)
                        </button>
                    </div>
                `;

                container.innerHTML = htmlContent;

            } catch (error) {
                console.error("Erro ao carregar o curso:", error);
                container.innerHTML = `
                    <div class="card" style="text-align: center;">
                        <h2 class="module-title" style="color: #ef4444;">Erro ao Conectar com o Firebase</h2>
                        <p style="color: var(--text-secondary); margin: 15px 0;">Verifique se as Regras de Segurança do Firestore estão configuradas como públicas (<code style="color:var(--accent-cyan)">allow read, write: if true;</code>).</p>
                        <button class="btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> Tentar Novamente</button>
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
